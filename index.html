<script>
var map = L.map('map', {
    zoomControl: false,
    maxZoom: 28,
    minZoom: 1
}).fitBounds([[44.75660072614984,10.746754990707464],[44.787372392260025,10.827541179677038]]);

var hash = new L.Hash(map);

map.on('click', function(e) {
    var lat = e.latlng.lat.toFixed(6);
    var lon = e.latlng.lng.toFixed(6);
    var streetViewUrl = 'https://www.google.com/maps/@?api=1&map_action=pano&viewpoint=' + lat + ',' + lon;
    L.popup()
        .setLatLng(e.latlng)
        .setContent('<a href="' + streetViewUrl + '" target="_blank">Apri Street View qui</a>')
        .openOn(map);
});

map.attributionControl.setPrefix('<a href="https://github.com/tomchadwin/qgis2web" target="_blank">qgis2web</a> &middot; <a href="https://leafletjs.com">Leaflet</a> &middot; <a href="https://qgis.org">QGIS</a>');

var autolinker = new Autolinker({truncate: {length: 30, location: 'smart'}});

function valueOrEmpty(feature, key) {
    return feature.properties && feature.properties[key] !== null && feature.properties[key] !== undefined
        ? autolinker.link(String(feature.properties[key]).replace(/'/g, "\\'").toLocaleString())
        : '';
}

function pdfLink(feature) {
    if (!feature.properties || feature.properties['scheda'] === null || feature.properties['scheda'] === undefined || String(feature.properties['scheda']).trim() === '') {
        return '';
    }
    var nome = String(feature.properties['scheda']).replace('../ALLEGATI/PDF/','').trim();
    return '<a href="schede/' + nome + '" target="_blank">Apri scheda PDF</a>';
}

function popupPunti(feature, layer) {
    var popupContent = '<table>' +
        '<tr><td colspan="2">' + valueOrEmpty(feature, 'fid') + '</td></tr>' +
        '<tr><td colspan="2">' + valueOrEmpty(feature, 'titolo') + '</td></tr>' +
        '<tr><td colspan="2">' + valueOrEmpty(feature, 'via') + '</td></tr>' +
        '<tr><td colspan="2">' + valueOrEmpty(feature, 'tipo') + '</td></tr>' +
        '<tr><td colspan="2">' + valueOrEmpty(feature, 'note') + '</td></tr>' +
        '<tr><td colspan="2">' + pdfLink(feature) + '</td></tr>' +
        '</table>';
    layer.bindPopup(popupContent, { maxHeight: 400 });
}

function streetViewUrlFromFeature(feature) {
    var coords = feature.geometry && feature.geometry.coordinates;
    var lon = null;
    var lat = null;

    if (!coords) return null;

    if (feature.geometry.type === 'LineString' && coords.length > 0) {
        var mid = coords[Math.floor(coords.length / 2)];
        lon = mid[0]; lat = mid[1];
    } else if (feature.geometry.type === 'MultiLineString' && coords.length > 0 && coords[0].length > 0) {
        var line = coords[0];
        var mid2 = line[Math.floor(line.length / 2)];
        lon = mid2[0]; lat = mid2[1];
    } else if (feature.geometry.type === 'Point') {
        lon = coords[0]; lat = coords[1];
    }

    if (lon === null || lat === null) return null;
    return 'https://www.google.com/maps/@?api=1&map_action=pano&viewpoint=' + lat + ',' + lon;
}

var zoomControl = L.control.zoom({ position: 'topleft' }).addTo(map);
var bounds_group = new L.featureGroup([]);
function setBounds() {}

// Basemap OSM

// Basemap Satellite

    attribution: '',
    minZoom: 1,

var baseMaps = {

};

L.control.layers(baseMaps, null, {
    collapsed: false,
    position: 'topright'

// LN rete ciclabile
function pop_LN_rete_ciclabile_Correggio_agg2026_2(feature, layer) {
    var popupContent = '<table>' +
        '<tr><td colspan="2">' + valueOrEmpty(feature, 'fid') + '</td></tr>' +
        '<tr><td colspan="2">' + valueOrEmpty(feature, 'via') + '</td></tr>' +
        '<tr><td colspan="2">' + valueOrEmpty(feature, 'tipo') + '</td></tr>' +
        '<tr><td colspan="2">' + valueOrEmpty(feature, 'lunghezza_metri') + '</td></tr>' +
        '<tr><td colspan="2">' + valueOrEmpty(feature, 'lunghezza_auto') + '</td></tr>' +
        '<tr><td colspan="2">' + (streetViewUrlFromFeature(feature) !== null ? '<a href="' + streetViewUrlFromFeature(feature) + '" target="_blank">Apri Street View</a>' : '') + '</td></tr>' +
        '</table>';
    layer.bindPopup(popupContent, { maxHeight: 400 });
}

function style_LN_rete_ciclabile_Correggio_agg2026_2_0(feature) {
    switch(String(feature.properties['tipo'])) {
        case 'esistente ciclopedonale sede propria':
            return {pane: 'pane_LN_rete_ciclabile_Correggio_agg2026_2', opacity: 1, color: 'rgba(227,26,28,1.0)', dashArray: '', lineCap: 'square', lineJoin: 'bevel', weight: 4.0, fillOpacity: 0, interactive: true};
        case 'esistente corsia ciclabile sede stradale':
            return {pane: 'pane_LN_rete_ciclabile_Correggio_agg2026_2', opacity: 1, color: 'rgba(253,237,131,1.0)', dashArray: '', lineCap: 'square', lineJoin: 'bevel', weight: 4.0, fillOpacity: 0, interactive: true};
        case 'esistente greenway':
            return {pane: 'pane_LN_rete_ciclabile_Correggio_agg2026_2', opacity: 1, color: 'rgba(51,160,44,1.0)', dashArray: '', lineCap: 'square', lineJoin: 'bevel', weight: 4.0, fillOpacity: 0, interactive: true};
        case 'storico 1994':
            return {pane: 'pane_LN_rete_ciclabile_Correggio_agg2026_2', opacity: 1, color: 'rgba(107,42,44,1.0)', dashArray: '', lineCap: 'square', lineJoin: 'bevel', weight: 4.0, fillOpacity: 0, interactive: true};
        case 'progetto ciclopedonale sede propria':
            return {pane: 'pane_LN_rete_ciclabile_Correggio_agg2026_2', opacity: 1, color: 'rgba(227,26,28,1.0)', dashArray: '4.0,8.0', lineCap: 'square', lineJoin: 'bevel', weight: 4.0, fillOpacity: 0, interactive: true};
        case 'progetto corsia ciclabile sede stradale':
            return {pane: 'pane_LN_rete_ciclabile_Correggio_agg2026_2', opacity: 1, color: 'rgba(255,228,0,1.0)', dashArray: '4.0,8.0', lineCap: 'square', lineJoin: 'bevel', weight: 4.0, fillOpacity: 0, interactive: true};
        case 'progetto greenway':
            return {pane: 'pane_LN_rete_ciclabile_Correggio_agg2026_2', opacity: 1, color: 'rgba(51,160,44,1.0)', dashArray: '4.0,8.0', lineCap: 'square', lineJoin: 'bevel', weight: 4.0, fillOpacity: 0, interactive: true};
        case 'progetto corsia ciclabile tratteggiata':
            return {pane: 'pane_LN_rete_ciclabile_Correggio_agg2026_2', opacity: 1, color: 'rgba(105,251,227,1.0)', dashArray: '4.0,8.0', lineCap: 'square', lineJoin: 'bevel', weight: 4.0, fillOpacity: 0, interactive: true};
        case 'progetto strada a priorità ciclabile':
            return {pane: 'pane_LN_rete_ciclabile_Correggio_agg2026_2', opacity: 1, color: 'rgba(107,42,250,1.0)', dashArray: '4.0,8.0', lineCap: 'square', lineJoin: 'bevel', weight: 4.0, fillOpacity: 0, interactive: true};
        default:
            return {pane: 'pane_LN_rete_ciclabile_Correggio_agg2026_2', opacity: 1, color: 'rgba(0,0,0,1.0)', dashArray: '', lineCap: 'square', lineJoin: 'bevel', weight: 3.0, fillOpacity: 0, interactive: true};
    }
}

map.createPane('pane_LN_rete_ciclabile_Correggio_agg2026_2');
map.getPane('pane_LN_rete_ciclabile_Correggio_agg2026_2').style.zIndex = 402;
map.getPane('pane_LN_rete_ciclabile_Correggio_agg2026_2').style['mix-blend-mode'] = 'normal';
var layer_LN_rete_ciclabile_Correggio_agg2026_2 = new L.geoJson(json_LN_rete_ciclabile_Correggio_agg2026_2, {
    attribution: '',
    interactive: true,
    dataVar: 'json_LN_rete_ciclabile_Correggio_agg2026_2',
    layerName: 'layer_LN_rete_ciclabile_Correggio_agg2026_2',
    pane: 'pane_LN_rete_ciclabile_Correggio_agg2026_2',
    onEachFeature: pop_LN_rete_ciclabile_Correggio_agg2026_2,
    style: style_LN_rete_ciclabile_Correggio_agg2026_2_0
});
bounds_group.addLayer(layer_LN_rete_ciclabile_Correggio_agg2026_2);
map.addLayer(layer_LN_rete_ciclabile_Correggio_agg2026_2);

function addPointLayer(options) {
    map.createPane(options.pane);
    map.getPane(options.pane).style.zIndex = options.zIndex;
    map.getPane(options.pane).style['mix-blend-mode'] = 'normal';

    var layer = new L.geoJson(options.json, {
        attribution: '',
        interactive: true,
        dataVar: options.dataVar,
        layerName: options.layerName,
        pane: options.pane,
        onEachFeature: popupPunti,
        pointToLayer: function (feature, latlng) {
            return L.marker(latlng, {
                icon: L.icon({
                    iconUrl: options.iconUrl,
                    iconSize: options.iconSize,
                    iconAnchor: options.iconAnchor
                })
            });
        }
    });

    bounds_group.addLayer(layer);
    map.addLayer(layer);
    return layer;
}
